<!doctype html>
<html lang="en" dir="ltr" data-theme="yellow">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="Take a photo, ask a question out loud, hear the answer. A helper for people with low vision." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Eyes for Everyone</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@500;700;800&family=Noto+Sans+Arabic:wght@500;800&family=Noto+Sans+Malayalam:wght@500;800&display=swap"
    />
    <link rel="stylesheet" href="/css/app.css" />
    <script type="module" src="/js/app.js"></script>
  </head>
  <body data-state="start" data-camera="off" data-photo="off">
    <svg class="sprite" width="0" height="0" aria-hidden="true">
      <defs>
        <!-- Bends what is behind the glass a little, like thick liquid glass (Chromium only) -->
        <filter id="lg-refract" x="-10%" y="-10%" width="120%" height="120%" color-interpolation-filters="sRGB">
          <feTurbulence type="fractalNoise" baseFrequency="0.006 0.009" numOctaves="2" seed="11" result="noise" />
          <feGaussianBlur in="noise" stdDeviation="3" result="soft" />
          <feDisplacementMap in="SourceGraphic" in2="soft" scale="46" xChannelSelector="R" yChannelSelector="G" />
        </filter>
        <symbol id="i-eye" viewBox="0 0 24 24"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z" /><circle cx="12" cy="12" r="3.2" /></symbol>
        <symbol id="i-cam" viewBox="0 0 24 24"><path d="M4 8h3l1.6-2.4h6.8L17 8h3v11H4Z" /><circle cx="12" cy="13.2" r="3.6" /></symbol>
        <symbol id="i-mic" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3" /><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21" /></symbol>
        <symbol id="i-spark" viewBox="0 0 24 24"><path d="M12 3c.6 4.6 3.4 7.4 8 8-4.6.6-7.4 3.4-8 8-.6-4.6-3.4-7.4-8-8 4.6-.6 7.4-3.4 8-8Z" /></symbol>
        <symbol id="i-redo" viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 2.4-5.7M4 4v4.6h4.6" /></symbol>
        <symbol id="i-plus" viewBox="0 0 24 24"><path d="M4 8h3l1.6-2.4h6.8L17 8h3v11H4Z" /><path d="M12 10.5v6M9 13.5h6" /></symbol>
        <symbol id="i-gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3" /><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1" /></symbol>
        <symbol id="i-globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" /><path d="M3 12h18M12 3c2.6 2.6 3.8 5.6 3.8 9s-1.2 6.4-3.8 9c-2.6-2.6-3.8-5.6-3.8-9S9.4 5.6 12 3Z" /></symbol>
        <symbol id="i-speed" viewBox="0 0 24 24"><path d="M4.2 17a8.5 8.5 0 1 1 15.6 0" /><path d="m12 13 4-4.5" /><circle cx="12" cy="13" r="1.2" /></symbol>
        <symbol id="i-text" viewBox="0 0 24 24"><path d="M3 19 8 5l5 14M4.8 14h6.4M15 19l3-8 3 8M15.9 16.6h4.2" /></symbol>
        <symbol id="i-contrast" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" /><path d="M12 3a9 9 0 0 1 0 18Z" fill="currentColor" /></symbol>
        <symbol id="i-reader" viewBox="0 0 24 24"><circle cx="12" cy="4.5" r="1.8" /><path d="M5 8.5 12 10l7-1.5M12 10v4.5M12 14.5 9 21M12 14.5 15 21" /></symbol>
        <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5" /></symbol>
        <symbol id="i-money" viewBox="0 0 24 24"><rect x="2.5" y="6" width="19" height="12" rx="2" /><circle cx="12" cy="12" r="2.6" /><path d="M6 9.5v5M18 9.5v5" /></symbol>
        <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4" /><path d="M12 2.5v2.5M12 19v2.5M2.5 12H5M19 12h2.5M5.3 5.3l1.8 1.8M16.9 16.9l1.8 1.8M5.3 18.7l1.8-1.8M16.9 7.1l1.8-1.8" /></symbol>
        <symbol id="i-kaaba" viewBox="0 0 24 24"><path d="M12 3 21 7.5v9L12 21l-9-4.5v-9Z" /><path d="M3 7.5 12 12l9-4.5M12 12v9M3.4 10.6 12 15l8.6-4.4" /></symbol>
        <symbol id="i-share" viewBox="0 0 24 24"><path d="M12 3v12M7.5 7.5 12 3l4.5 4.5" /><path d="M5 12v7.5h14V12" /></symbol>
        <symbol id="i-palette" viewBox="0 0 24 24"><path d="M12 3a9 9 0 0 0 0 18c1.4 0 2-1 2-2s-.8-1.4-.8-2.4c0-1 .9-1.6 2-1.6H17a4 4 0 0 0 4-4c0-4.4-4-8-9-8Z" /><circle cx="7.5" cy="11" r="1.2" /><circle cx="10.5" cy="7.2" r="1.2" /><circle cx="15" cy="7.8" r="1.2" /></symbol>
        <symbol id="i-image" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2.5" /><circle cx="9" cy="9.5" r="1.8" /><path d="m4 18 5.5-5.5 4 4 2.5-2.5L21 19" /></symbol>
        <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M12 3 19 20l-7-4-7 4Z" /></symbol>
      </defs>
    </svg>

    <!-- Background: live camera, the frozen photo, or soft moving light -->
    <div id="scene" aria-hidden="true">
      <div class="aurora"><span></span><span></span><span></span></div>
      <video id="video" playsinline muted autoplay></video>
      <img id="photo" alt="" />
      <div class="veil"></div>
    </div>
    <div id="flash" aria-hidden="true"></div>
    <!-- Glowing screen edge while listening and thinking -->
    <div class="edge edge-soft" aria-hidden="true"></div>
    <div class="edge edge-sharp" aria-hidden="true"></div>

    <div class="hud">
      <div class="pill glass" aria-hidden="true"><span class="orb"></span><span id="status-word">START</span></div>

      <!-- Middle of the screen: a picture of what is happening now -->
      <div class="focus" aria-hidden="true">
        <div class="brand">
          <div class="logo glass"><svg class="ic"><use href="#i-eye" /></svg></div>
          <div class="wordmark" id="wordmark">Eyes for Everyone</div>
        </div>
        <div class="viewfinder"><i></i><i></i><i></i><i></i></div>
        <div class="shutter"><span><svg class="ic"><use id="mode-icon" href="#i-cam" /></svg></span></div>
        <div class="dots"><i></i><i></i><i></i><i></i><i></i><i></i></div>
        <div class="target"><span class="swatch"></span></div>
        <div class="lightmeter"><span class="glow"></span><span class="core"><svg class="ic"><use href="#i-sun" /></svg></span></div>
        <div class="compass">
          <span class="ring"></span>
          <span class="needle"><svg class="ic"><use href="#i-arrow" /></svg></span>
          <span class="kaaba"><svg class="ic"><use href="#i-kaaba" /></svg></span>
        </div>
        <div class="voice">
          <span class="ring r3"></span><span class="ring r2"></span><span class="ring r1"></span>
          <span class="core"><svg class="ic"><use href="#i-mic" /></svg></span>
        </div>
        <div class="think"><span class="blob"></span><span class="core"><svg class="ic"><use href="#i-spark" /></svg></span></div>
      </div>

      <div class="sheet glass">
        <span class="grabber" aria-hidden="true"></span>
        <div id="message"></div>
      </div>
    </div>

    <!-- The whole screen is this one button -->
    <button id="stage" type="button" aria-label="Tap anywhere to start"></button>

    <button id="welcome-sr" class="big glass" type="button">
      <svg class="ic" aria-hidden="true"><use href="#i-reader" /></svg><span class="v">Screen reader mode</span>
    </button>

    <!-- Screen reader mode: a few very large buttons instead of gestures -->
    <div id="sr-panel">
      <button id="sr-main" class="big glass primary" type="button">
        <svg class="ic ic-cam" aria-hidden="true"><use href="#i-cam" /></svg>
        <svg class="ic ic-mic" aria-hidden="true"><use href="#i-mic" /></svg>
        <svg class="ic ic-spark" aria-hidden="true"><use href="#i-spark" /></svg>
        <span class="v">Start</span>
      </button>
      <div class="sr-row">
        <button id="sr-new" class="big glass" type="button" hidden><svg class="ic" aria-hidden="true"><use href="#i-plus" /></svg><span class="v">New photo</span></button>
        <button id="sr-repeat" class="big glass" type="button" hidden><svg class="ic" aria-hidden="true"><use href="#i-redo" /></svg><span class="v">Repeat</span></button>
        <button id="sr-open" class="big glass" type="button" hidden><svg class="ic" aria-hidden="true"><use href="#i-image" /></svg><span class="v">Open picture</span></button>
        <button id="sr-mode" class="big glass" type="button" hidden><svg class="ic" aria-hidden="true"><use href="#i-redo" /></svg><span class="v">Mode</span></button>
        <button id="sr-share" class="big glass" type="button" hidden><svg class="ic" aria-hidden="true"><use href="#i-share" /></svg><span class="v">Share</span></button>
        <button id="sr-settings" class="big glass" type="button" hidden><svg class="ic" aria-hidden="true"><use href="#i-gear" /></svg><span class="v">Settings</span></button>
      </div>
    </div>

    <div id="settings" role="dialog" aria-modal="true" aria-labelledby="settings-title" hidden>
      <div class="settings-sheet glass">
        <h2 id="settings-title"><svg class="ic" aria-hidden="true"><use href="#i-gear" /></svg><span class="v">Settings</span></h2>
        <div class="rows">
          <button type="button" class="row" data-set="lang"><svg class="ic" aria-hidden="true"><use href="#i-globe" /></svg><span class="v"></span></button>
          <button type="button" class="row" data-set="speed"><svg class="ic" aria-hidden="true"><use href="#i-speed" /></svg><span class="v"></span></button>
          <button type="button" class="row" data-set="size"><svg class="ic" aria-hidden="true"><use href="#i-text" /></svg><span class="v"></span></button>
          <button type="button" class="row" data-set="theme"><svg class="ic" aria-hidden="true"><use href="#i-contrast" /></svg><span class="v"></span></button>
          <button type="button" class="row" data-set="sr"><svg class="ic" aria-hidden="true"><use href="#i-reader" /></svg><span class="v"></span></button>
        </div>
        <button type="button" class="big done" data-set="done"><svg class="ic" aria-hidden="true"><use href="#i-check" /></svg><span class="v"></span></button>
      </div>
    </div>

    <!-- Pictures from the gallery or the computer (swipe down, O key, or the Open button) -->
    <input id="file-input" type="file" accept="image/*" hidden />

    <!-- Laptop/PC: shown while a picture is dragged over the window -->
    <div id="drop" aria-hidden="true"><div class="glass"><svg class="ic"><use href="#i-image" /></svg><span id="drop-text">Drop the picture here.</span></div></div>

    <!-- Screen readers announce these when they change -->
    <div id="live-status" class="sr-only" role="status" aria-live="assertive" aria-atomic="true"></div>
    <div id="live-message" class="sr-only" aria-live="polite" aria-atomic="true"></div>

    <noscript><p class="noscript">Eyes for Everyone needs JavaScript turned on.</p></noscript>
  </body>
</html>
